name: CI

# Pipeline (two workflows, order guaranteed via `needs` / workflow_run):
#
#   CI (this file, pull_request — untrusted: read-only token, no secrets):
#     PR Lint ── Signed Commits
#   PR Guard (workflow_run after CI — trusted master copy, write token):
#     Spam Guard (all PRs) ── LGTM (review) ── Auto-merge (dependabot)
#
# PRs use pull_request (never pull_request_target): for fork PRs the token is
# read-only and secrets are unavailable, and no fork code is checked out in a
# privileged context. PR files are checked out (without credentials) into ./pr
# for linting only and are never executed. Every checkout here is pinned to
# master, so a PR cannot alter the config or the scripts. The privileged half
# lives in pr-guard.yml: it runs the master copy after CI completes and only
# talks to the API — fork code is never checked out or executed there either.
on:
  push:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PR Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Base branch (trusted): provides .rumdl.toml
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && 'master' || github.ref }}
          persist-credentials: false
      # PR merge commit (untrusted): data only, linted with the base config
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          path: pr
          persist-credentials: false
      - uses: rvben/rumdl@v0.3.2
        with:
          config: .rumdl.toml
          command: fmt-check
          path: ${{ github.event_name == 'pull_request' && 'pr' || '' }}

  signed-commits:
    name: Signed Commits
    needs: lint
    # Always required for every PR, regardless of author or lint result
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && 'master' || github.ref }}
          persist-credentials: false
      - name: Check all PR commits are signed
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { default: signedCommits } = await import('${{ github.workspace }}/.github/scripts/signed-commits.js')

            await signedCommits({github, context, core})
